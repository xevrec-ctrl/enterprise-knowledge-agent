[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "A Chinese enterprise knowledge and task collaboration agent built with LangGraph."
authors = [
    { name = "xevrec-ctrl" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.0",
    "langchain>=1.3.17",
    "python-dotenv>=1.2.3",
]


[project.optional-dependencies]
dev = ["mypy>=2.3.1", "ruff>=0.16.4"]

[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["enterprise_agent"]
[tool.setuptools.package-dir]
"enterprise_agent" = "src/enterprise_agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"scripts/*" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = [
    "integration: tests that call a real language model API",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
